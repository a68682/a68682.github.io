<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dream Day · 每一天都值得期待">
  <meta name="theme-color" content="#faf7f2">
  <title>dreamday</title>
  <style>
    :root {
      color-scheme: light;
      background: #faf7f2;
      color: #292431;
      font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 82% 9%, #e8def5 0%, transparent 52%),
        radial-gradient(ellipse at 12% 85%, #f4dfd4 0%, transparent 49%),
        radial-gradient(ellipse at 47% 49%, #fffdf8 0%, transparent 55%),
        #faf7f2;
    }
    main {
      width: min(100%, 60rem);
      padding: 4rem 1.25rem;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
      font-size: clamp(3.55rem, 12vw, 9rem);
      font-weight: 400;
      line-height: .98;
      letter-spacing: -.075em;
    }
    p {
      margin: 1.45rem 0 2.15rem;
      color: #52495e;
      font-size: clamp(.98rem, 2.6vw, 1.16rem);
      line-height: 1.65;
      letter-spacing: .035em;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: .65rem;
      min-height: 2.85rem;
      padding: .65rem 1.2rem;
      border: 1px solid #a497b0;
      border-radius: 10rem;
      background: #fffafa;
      color: #342641;
      text-decoration: none;
      font-size: .95rem;
      font-weight: 600;
      transition: background-color .18s ease, border-color .18s ease;
    }
    a:hover { background: #eee5f5; border-color: #6a5379; }
    a:focus-visible { outline: 3px solid #6a5379; outline-offset: 4px; }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } }
  </style>
</head>
<body>
  <main>
    <h1>dreamday</h1>
    <p>Dream Day · 每一天都值得期待</p>

  </main>
</body>
</html>
